<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一高祭 QRチェックイン</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --theme-color: #2ed573;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    /* モード切り替えタブ */
    .tab-container {
      display: flex;
      background: #222;
      padding: 5px;
      margin: 15px auto;
      border-radius: 12px;
      max-width: 90%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 10px;
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .tab-btn.active[data-mode="entry"] { background: #2ed573; color: #000; }
    .tab-btn.active[data-mode="exit"] { background: #ffa500; color: #000; }
    .tab-btn.active[data-mode="re_entry"] { background: #1e90ff; color: #fff; }

    h1 {
      font-size: 20px;
      margin: 15px 0 5px 0;
      letter-spacing: 1px;
    }

    #current-mode-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      background: var(--theme-color);
      color: #000;
      margin-bottom: 15px;
      transition: all 0.3s;
    }
    #current-mode-badge.light-text { color: #fff; }

    #wrapper {
      position: relative;
      width: 90%;
      max-width: 360px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* スキャン枠 */
    .scan-frame {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      border: 3px dashed rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      box-sizing: border-box;
      z-index: 5;
      transition: all 0.2s ease;
    }
    .scan-frame.detected {
      border: 4px solid var(--theme-color);
      box-shadow: 0 0 25px var(--theme-color);
      background: rgba(255, 255, 255, 0.1);
    }

    #start-btn {
      margin-top: 25px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      background: #2ed573;
      color: black;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(46,213,115,0.4);
      transition: all 0.3s;
    }

    /* ========================================================
        🍏 劇的進化：MagSafe風一筆書きSVGアニメーション
    ======================================================== */
    #magsafe-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4); /* 背景をフワッと暗く */
      backdrop-filter: blur(8px);    /* トレンドの背景ぼかし */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    /* オーバーレイ表示時 */
    #magsafe-overlay.active {
      opacity: 1;
    }

    /* 土台となるリングのコンテナ */
    .magsafe-ring {
      width: 200px;
      height: 200px;
      border: 6px solid rgba(255, 255, 255, 0.15); /* うっすら見えるガイド線 */
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      transform: scale(0.6);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* バウンドする動き */
    }
    #magsafe-overlay.active .magsafe-ring {
      transform: scale(1);
    }

    /* 円をなぞるプログレスアニメーション */
    .magsafe-progress {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 200px;
      height: 200px;
      transform: rotate(-90deg); /* 真上からスタートさせる */
    }
    .magsafe-progress circle {
      fill: none;
      stroke: var(--magsafe-color);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 628;
      stroke-dashoffset: 628;
    }
    /* 成功・エラー確定時にサークル線を描画 */
    #magsafe-overlay.animate .magsafe-progress circle {
      animation: fillCircle 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* 真ん中の一筆書きアイコン用SVG */
    .magsafe-svg-icon {
      width: 85px;
      height: 85px;
    }
    .magsafe-svg-icon path,
    .magsafe-svg-icon polyline,
    .magsafe-svg-icon line {
      fill: none;
      stroke: #ffffff;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
    }
    /* サークルが描き終わる頃(0.4秒後)にペンで描くように描画 */
    #magsafe-overlay.animate .magsafe-svg-icon .draw-item {
      animation: drawCheck 0.45s 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* アニメーションの軌跡定義 */
    @keyframes fillCircle {
      0% { stroke-dashoffset: 628; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes drawCheck {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    /* 下からふわっと出るテキスト */
    #magsafe-text {
      margin-top: 30px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      opacity: 0;
      transform: translateY(10px);
    }
    #magsafe-overlay.animate #magsafe-text {
      animation: textFadeIn 0.3s ease-out 0.2s forwards;
    }
    @keyframes textFadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ========================================================
        🔄 通信中（Loading）のスタイル
    ======================================================== */
    #magsafe-overlay.loading .magsafe-ring {
      transform: scale(1);
    }
    #magsafe-overlay.loading .magsafe-progress circle {
      stroke: #ffffff;
      stroke-dasharray: 628;
      stroke-dashoffset: 450; /* 少し隙間のある線にする */
      animation: spin 1s linear infinite;
      transform-origin: center;
    }
    #magsafe-overlay.loading #magsafe-text {
      opacity: 1;
      transform: translateY(0);
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* モード別の色指定変数を一元管理 */
    .status-ok { --magsafe-color: #2ed573; }
    .status-exit { --magsafe-color: #ffa500; }
    .status-reentry { --magsafe-color: #1e90ff; }
    .status-error { --magsafe-color: #ff4757; }
  </style>
</head>
<body>

  <h1>一高祭 受付管理システム</h1>
  
  <div class="tab-container">
    <button class="tab-btn active" data-mode="entry" onclick="setMode('entry')">🟢 初回入場</button>
    <button class="tab-btn" data-mode="exit" onclick="setMode('exit')">🚪 一時退場</button>
    <button class="tab-btn" data-mode="re_entry" onclick="setMode('re_entry')">🔵 再入場</button>
  </div>

  <div id="current-mode-badge">現在のモード: 初回入場</div>

  <div id="wrapper">
    <div class="scan-frame" id="scan-frame"></div>
    <video id="video" autoplay playsinline></video>

    <div id="magsafe-overlay">
      <div class="magsafe-ring">
        <svg class="magsafe-progress" viewBox="0 0 212 212">
          <circle cx="106" cy="106" r="100"></circle>
        </svg>
        
        <div id="magsafe-icon-box">
          </div>
      </div>
      <div id="magsafe-text">読み取り中...</div>
    </div>
  </div>

  <button id="start-btn" onclick="startCamera()">▶ カメラを開始する</button>

  <script>
    // デプロイしたGASのWebアプリURL（★ここにあなたのURLを入れてください）
    const GAS_URL = "https://script.google.com/a/macros/g.bears.ed.jp/s/AKfycbxdMLfj6qHITIEInB52DC1DJqojKlb-dWb43AoqMchlkCFyuqRpZtqB_0u6vcFydGw/exec";

    let currentMode = "entry"; 
    let video = document.getElementById("video");
    let scanFrame = document.getElementById("scan-frame");
    let isScanning = false;
    let audioCtx = null;

    // モード切り替え関数
    function setMode(mode) {
      currentMode = mode;
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
      
      let badge = document.getElementById("current-mode-badge");
      if (mode === "entry") {
        document.documentElement.style.setProperty('--theme-color', '#2ed573');
        badge.innerText = "現在のモード: 初回入場";
        badge.classList.remove('light-text');
      } else if (mode === "exit") {
        document.documentElement.style.setProperty('--theme-color', '#ffa500');
        badge.innerText = "現在のモード: 一時退場";
        badge.classList.remove('light-text');
      } else if (mode === "re_entry") {
        document.documentElement.style.setProperty('--theme-color', '#1e90ff');
        badge.innerText = "現在のモード: 再入場";
        badge.classList.add('light-text');
      }
    }

    // サウンドエフェクト関数
    function playTone(type) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "ok") {
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === "exit") {
        osc.frequency.setValueAtTime(587, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.stop(audioCtx.currentTime + 0.15);
      } else {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    // カメラ起動
    function startCamera() {
      document.getElementById("start-btn").style.display = "none";
      setMode("entry");
      
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
          video.srcObject = stream;
          isScanning = true;
          requestAnimationFrame(scanQRCode);
        })
        .catch(err => {
          alert("カメラの起動に失敗しました。権限を許可してください。");
          document.getElementById("start-btn").style.display = "inline-block";
        });
    }

    // QRコードスキャンループ
    function scanQRCode() {
      if (!isScanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        let canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        let ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data) {
          isScanning = false;
          scanFrame.classList.add("detected");
          
          setTimeout(() => {
            processTicket(code.data);
          }, 150);
          return;
        }
      }
      requestAnimationFrame(scanQRCode);
    }

    // GASへデータを送信してチェックイン
    function processTicket(qrData) {
      let ticketId = "";
      let decodedData = decodeURIComponent(qrData);

      if (decodedData.includes("id=")) {
        ticketId = decodedData.split("id=")[1].split("&")[0].trim();
      } else if (decodedData.startsWith("TKT-")) {
        ticketId = decodedData.trim();
      } else {
        triggerMagsafe("error", "❌ 無効なQRコード", "invalid");
        logInvalidQR(qrData);
        return;
      }

      if (!ticketId) {
        triggerMagsafe("error", "❌ IDの抽出に失敗", "invalid");
        logInvalidQR(qrData);
        return;
      }

      // ローディングアニメ開始
      triggerMagsafe("loading", "通信中...", "");

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          ticketId: ticketId,
          mode: currentMode
        })
      })
      .then(res => res.text())
      .then(result => {
        if (result === "OK") {
          triggerMagsafe("ok", "✅ 入場手続き完了", "ok");
        } else if (result === "EXIT_OK") {
          triggerMagsafe("exit", "🚪 一時退場しました", "exit");
        } else if (result === "RE_ENTRY_OK") {
          triggerMagsafe("reentry", "🔄 再入場手続き完了", "ok");
        } else if (result === "already" || result === "ALREADY_IN") {
          triggerMagsafe("error", "⚠️ すでに滞在中（重複）", "error");
        } else if (result === "ALREADY_OUT") {
          triggerMagsafe("error", "⚠️ すでに退場済みです", "error");
        } else if (result === "ERROR_NOT_IN_YET") {
          triggerMagsafe("error", "❌ まだ入場していません", "error");
        } else {
          triggerMagsafe("error", "❌ チケットが見つかりません", "error");
        }
      })
      .catch(err => {
        triggerMagsafe("error", "📡 通信エラーが発生しました", "error");
      });
    }

    function logInvalidQR(rawCode) {
      fetch(GAS_URL + "?mode=log_invalid&data=" + encodeURIComponent(rawCode), { method: "POST" });
    }

    // MagSafe風アニメーションの表示制御（一筆書きSVG対応版）
    function triggerMagsafe(statusClass, text, soundType) {
      let overlay = document.getElementById("magsafe-overlay");
      let iconBox = document.getElementById("magsafe-icon-box");
      let txtNode = document.getElementById("magsafe-text");

      // クラスを完全にクリア
      overlay.className = "";
      iconBox.innerHTML = ""; // 前のSVGアイコンを消去

      if (statusClass === "loading") {
        overlay.classList.add("active", "loading");
        txtNode.innerText = text;
        return;
      }

      // モードに応じたSVG一筆書きアイコンを生成
      let svgContent = "";
      if (statusClass === "ok" || statusClass === "reentry") {
        // ✅ チェックマークの一筆書き
        svgContent = `
          <svg class="magsafe-svg-icon" viewBox="0 0 24 24">
            <polyline class="draw-item" points="20 6 9 17 4 12"></polyline>
          </svg>`;
      } else if (statusClass === "exit") {
        // 🚪 ドア・矢印の一筆書き（一時退場用）
        svgContent = `
          <svg class="magsafe-svg-icon" viewBox="0 0 24 24">
            <path class="draw-item" d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5"></path>
            <polyline class="draw-item" points="11 9 15 12 11 15"></polyline>
            <line class="draw-item" x1="15" y1="12" x2="3" y2="12"></line>
          </svg>`;
      } else if (statusClass === "error") {
        // ⚠️ 警告バツマークの一筆書き（エラー用）
        svgContent = `
          <svg class="magsafe-svg-icon" viewBox="0 0 24 24">
            <line class="draw-item" x1="18" y1="6" x2="6" y2="18"></line>
            <line class="draw-item" x1="6" y1="6" x2="18" y2="18"></line>
          </svg>`;
      }

      iconBox.innerHTML = svgContent;
      txtNode.innerText = text;

      // クラスを付与して一斉にアニメーション開始
      overlay.className = "active animate status-" + statusClass;

      if (soundType) playTone(soundType);

      // アニメーションの余韻を楽しめるよう、1.8秒後に次のスキャンへ
      setTimeout(() => {
        overlay.className = "";
        scanFrame.classList.remove("detected");
        isScanning = true;
        requestAnimationFrame(scanQRCode);
      }, 1800);
    }
  </script>
</body>
</html>
