<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一高祭 QRチェックイン</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --theme-color: #002366; /* 初期は入場モード（ネイビー） */
      --success-color: #2ed573;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    /* モード切り替えタブ */
    .tab-container {
      display: flex;
      background: #222;
      padding: 5px;
      margin: 15px auto;
      border-radius: 8px;
      max-width: 90%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active[data-mode="entry"] { background: #2ed573; color: #000; }
    .tab-btn.active[data-mode="exit"] { background: #ffa500; color: #000; }
    .tab-btn.active[data-mode="re_entry"] { background: #1e90ff; color: #fff; }

    h1 {
      font-size: 20px;
      margin: 10px 0 5px 0;
      letter-spacing: 1px;
    }

    #current-mode-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: var(--theme-color);
      margin-bottom: 15px;
      transition: background 0.3s;
    }

    #wrapper {
      position: relative;
      width: 90%;
      max-width: 400px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* スキャン線のレーザー演出 */
    .laser {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--theme-color);
      box-shadow: 0 0 12px var(--theme-color);
      animation: scan 2s linear infinite;
      z-index: 5;
      transition: background 0.3s, box-shadow 0.3s;
    }

    @keyframes scan {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }

    /* 開始ボタン */
    #start-btn {
      margin-top: 20px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      background: var(--theme-color);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,35,102,0.4);
      transition: all 0.3s;
    }

    /* MagSafe風アニメーションオーバーレイ */
    #magsafe-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .magsafe-circle {
      width: 140px;
      height: 140px;
      border: 8px solid transparent;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: scale(0.5);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .magsafe-icon {
      font-size: 50px;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #magsafe-text {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: white;
    }

    /* アニメーション発火用クラス */
    #magsafe-overlay.active { opacity: 1; }
    #magsafe-overlay.active .magsafe-circle { transform: scale(1); }
    #magsafe-overlay.active .magsafe-icon { opacity: 1; transform: scale(1); }

    /* ステータス別の色定義 */
    .status-ok .magsafe-circle { border-color: #2ed573; box-shadow: 0 0 20px rgba(46,213,115,0.4); }
    .status-ok .magsafe-icon { color: #2ed573; }
    
    .status-exit .magsafe-circle { border-color: #ffa500; box-shadow: 0 0 20px rgba(255,165,0,0.4); }
    .status-exit .magsafe-icon { color: #ffa500; }

    .status-reentry .magsafe-circle { border-color: #1e90ff; box-shadow: 0 0 20px rgba(30,144,255,0.4); }
    .status-reentry .magsafe-icon { color: #1e90ff; }

    .status-error .magsafe-circle { border-color: #ff4757; box-shadow: 0 0 20px rgba(255,71,87,0.4); }
    .status-error .magsafe-icon { color: #ff4757; }
  </style>
</head>
<body>

  <h1>一高祭 受付管理システム</h1>
  
  <div class="tab-container">
    <button class="tab-btn active" data-mode="entry" onclick="setMode('entry')">🟢 初回入場</button>
    <button class="tab-btn" data-mode="exit" onclick="setMode('exit')">🚪 一時退場</button>
    <button class="tab-btn" data-mode="re_entry" onclick="setMode('re_entry')">🔵 再入場</button>
  </div>

  <div id="current-mode-badge">現在のモード: 初回入場</div>

  <div id="wrapper">
    <div class="laser" id="laser"></div>
    <video id="video" autoplay playsinline></video>

    <div id="magsafe-overlay">
      <div class="magsafe-circle" id="magsafe-circle">
        <span class="magsafe-icon" id="magsafe-icon">✓</span>
      </div>
      <div id="magsafe-text">読み取り中...</div>
    </div>
  </div>

  <button id="start-btn" onclick="startCamera()">▶ カメラを開始する</button>

  <script>
    // デプロイしたGASのWebアプリURL（★ここにあなたのURLを入れてください）
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxdMLfj6qHITIEInB52DC1DJqojKlb-dWb43AoqMchlkCFyuqRpZtqB_0u6vcFydGw/exec";

    let currentMode = "entry"; // 初期モード
    let video = document.getElementById("video");
    let laser = document.getElementById("laser");
    let isScanning = false;
    let audioCtx = null;

    // モード切り替え関数
    function setMode(mode) {
      currentMode = mode;
      
      // タブボタンの装飾更新
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
      
      // テーマカラーとバッジテキストの更新
      let badge = document.getElementById("current-mode-badge");
      if (mode === "entry") {
        document.documentElement.style.setProperty('--theme-color', '#2ed573');
        badge.innerText = "現在のモード: 初回入場";
      } else if (mode === "exit") {
        document.documentElement.style.setProperty('--theme-color', '#ffa500');
        badge.innerText = "現在のモード: 一時退場";
      } else if (mode === "re_entry") {
        document.documentElement.style.setProperty('--theme-color', '#1e90ff');
        badge.innerText = "現在のモード: 再入場";
      }
    }

    // サウンドエフェクト関数
    function playTone(type) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "ok") {
        // 通常入場・再入場（高音ピピッ）
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === "exit") {
        // 退場（少し中音のピピッ）
        osc.frequency.setValueAtTime(587, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.stop(audioCtx.currentTime + 0.15);
      } else {
        // エラー（低音ブブー）
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    // カメラ起動
    function startCamera() {
      document.getElementById("start-btn").style.display = "none";
      setMode("entry"); // 初期カラーをセット
      
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
          video.srcObject = stream;
          isScanning = true;
          requestAnimationFrame(scanQRCode);
        })
        .catch(err => {
          alert("カメラの起動に失敗しました。権限を許可してください。");
          document.getElementById("start-btn").style.display = "inline-block";
        });
    }

    // QRコードスキャンループ
    function scanQRCode() {
      if (!isScanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // キャンバスを作成してビデオ画像を解析
        let canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        let ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data) {
          // QRコードを発見したら一時停止して処理
          isScanning = false;
          processTicket(code.data);
          return;
        }
      }
      requestAnimationFrame(scanQRCode);
    }

    // GASへデータを送信してチェックイン
    function processTicket(qrData) {
      let ticketId = "";
      
      // URLからIDを抽出
      if (qrData.includes("?id=")) {
        ticketId = qrData.split("?id=")[1].split("&")[0];
      } else {
        // 不正なQRの場合
        triggerMagsafe("error", "❌ 無効なQRコード", "invalid");
        logInvalidQR(qrData);
        return;
      }

      triggerMagsafe("loading", "通信中...", "");

      // GASにJSON形式でデータをPOST送信
      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          ticketId: ticketId,
          mode: currentMode
        })
      })
      .then(res => res.text())
      .then(result => {
        if (result === "OK") {
          triggerMagsafe("ok", "✅ 入場OK", "ok");
        } else if (result === "EXIT_OK") {
          triggerMagsafe("exit", "🚪 一時退場完了", "exit");
        } else if (result === "RE_ENTRY_OK") {
          triggerMagsafe("reentry", "🔄 再入場OK", "ok");
        } else if (result === "already" || result === "ALREADY_IN") {
          triggerMagsafe("error", "⚠️ すでに滞在中です", "error");
        } else if (result === "ALREADY_OUT") {
          triggerMagsafe("error", "⚠️ すでに退場済みです", "error");
        } else if (result === "ERROR_NOT_IN_YET") {
          triggerMagsafe("error", "❌ まだ一度も入場していません", "error");
        } else {
          triggerMagsafe("error", "❌ チケットが見つかりません", "error");
        }
      })
      .catch(err => {
        triggerMagsafe("error", "📡 通信エラーが発生しました", "error");
      });
    }

    // 不正QRコードのログをGASに送る
    function logInvalidQR(rawCode) {
      fetch(GAS_URL + "?mode=log_invalid&data=" + encodeURIComponent(rawCode), { method: "POST" });
    }

    // MagSafe風アニメーションの表示制御
    function triggerMagsafe(statusClass, text, soundType) {
      let overlay = document.getElementById("magsafe-overlay");
      let icon = document.getElementById("magsafe-icon");
      let txtNode = document.getElementById("magsafe-text");

      // クラスを一旦リセット
      overlay.className = "active";
      
      if (statusClass === "loading") {
        icon.innerText = "⏳";
        txtNode.innerText = text;
        return;
      }

      // ステータスに応じた装飾
      overlay.classList.add("status-" + statusClass);
      txtNode.innerText = text;
      
      if (statusClass === "ok" || statusClass === "reentry") icon.innerText = "✓";
      if (statusClass === "exit") icon.innerText = "🚪";
      if (statusClass === "error") icon.innerText = "⚠️";

      // 音を鳴らす
      if (soundType) playTone(soundType);

      // 2.5秒後にアニメーションを閉じてスキャンを再開
      setTimeout(() => {
        overlay.className = "";
        isScanning = true;
        requestAnimationFrame(scanQRCode);
      }, 2500);
    }
  </script>
</body>
</html>
