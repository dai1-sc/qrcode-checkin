<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f2f2f2; }
    #reader { max-width: 400px; margin: auto; }
    #result { margin-top: 20px; font-size: 18px; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
    .already { color: gray; }
  </style>
</head>
<body>
  <h2>QRチェックイン</h2>
  <div id="reader"></div>
  <div id="result"></div>

  <script>
    let scanning = true;

    const scanner = new Html5QrcodeScanner("reader", {
      fps: 10,
      qrbox: 250
    });

    scanner.render((decodedText) => {
      if (!scanning) return;
      scanning = false;

      let ticketId;
      try {
        const url = new URL(decodedText);
        ticketId = url.searchParams.get("id");
      } catch {
        try {
          const url = new URL(decodeURIComponent(decodedText));
          ticketId = url.searchParams.get("id");
        } catch {
          ticketId = decodedText;
        }
      }

      if (!ticketId) {
        document.getElementById("result").innerHTML = '<span class="error">無効なQRコードです</span>';
        setTimeout(() => { scanning = true; }, 3000);
        return;
      }

      fetch("https://script.google.com/a/macros/g.bears.ed.jp/s/AKfycbxdMLfj6qHITIEInB52DC1DJqojKlb-dWb43AoqMchlkCFyuqRpZtqB_0u6vcFydGw/exec?id=" + ticketId, {
        method: "POST"
      }).then(res => res.text()).then(text => {
        if (text === "already") {
          document.getElementById("result").innerHTML = '<span class="already">⚠️ チェックイン済みです</span>';
        } else {
          document.getElementById("result").innerHTML = '<span class="success">✅ チェックイン完了！</span>';
        }
        setTimeout(() => {
          document.getElementById("result").innerHTML = "";
          scanning = true;
        }, 3000);
      }).catch(() => {
        document.getElementById("result").innerHTML = '<span class="error">エラーが発生しました</span>';
        setTimeout(() => { scanning = true; }, 3000);
      });
    });
  </script>
</body>
</html>
