<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一高祭 QRチェックイン</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --theme-color: #2ed573; /* 初期は入場モード（グリーン） */
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    /* モード切り替えタブ */
    .tab-container {
      display: flex;
      background: #222;
      padding: 5px;
      margin: 15px auto;
      border-radius: 12px;
      max-width: 90%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .tab-btn {
      flex: 1;
      padding: 12px 10px;
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .tab-btn.active[data-mode="entry"] { background: #2ed573; color: #000; }
    .tab-btn.active[data-mode="exit"] { background: #ffa500; color: #000; }
    .tab-btn.active[data-mode="re_entry"] { background: #1e90ff; color: #fff; }

    h1 {
      font-size: 20px;
      margin: 15px 0 5px 0;
      letter-spacing: 1px;
    }

    #current-mode-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      background: var(--theme-color);
      color: #000;
      margin-bottom: 15px;
      transition: all 0.3s;
    }
    /* 退場・再入場時の文字色調整 */
    #current-mode-badge.light-text {
      color: #fff;
    }

    #wrapper {
      position: relative;
      width: 90%;
      max-width: 360px;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 🎯 復活：静かな正方形のスキャン枠（通常時は白っぽく、検知するとモード色に光る） */
    .scan-frame {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      border: 3px dashed rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      box-sizing: border-box;
      z-index: 5;
      transition: all 0.2s ease;
    }
    
    /* QRコードを検知した瞬間に枠を光らせるクラス */
    .scan-frame.detected {
      border: 4px solid var(--theme-color);
      box-shadow: 0 0 25px var(--theme-color);
      background: rgba(255, 255, 255, 0.1);
    }

    /* 開始ボタン */
    #start-btn {
      margin-top: 25px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      background: #2ed573;
      color: black;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(46,213,115,0.4);
      transition: all 0.3s;
    }

    /* 🔥 完全復活：MagSafe風アニメーションオーバーレイ */
    #magsafe-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .magsafe-circle {
      width: 150px;
      height: 150px;
      border: 8px solid transparent;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: scale(0.4);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .magsafe-icon {
      font-size: 60px;
      opacity: 0;
      transform: scale(0.4);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #magsafe-text {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      padding: 0 20px;
    }

    /* アニメーション起動時のエフェクトクラス */
    #magsafe-overlay.active { opacity: 1; }
    #magsafe-overlay.active .magsafe-circle { transform: scale(1); }
    #magsafe-overlay.active .magsafe-icon { opacity: 1; transform: scale(1); }

    /* 各ステータスのMagSafeカラー */
    .status-ok .magsafe-circle { border-color: #2ed573; box-shadow: 0 0 30px rgba(46,213,115,0.6); }
    .status-ok .magsafe-icon { color: #2ed573; }
    
    .status-exit .magsafe-circle { border-color: #ffa500; box-shadow: 0 0 30px rgba(255,165,0,0.6); }
    .status-exit .magsafe-icon { color: #ffa500; }

    .status-reentry .magsafe-circle { border-color: #1e90ff; box-shadow: 0 0 30px rgba(30,144,255,0.6); }
    .status-reentry .magsafe-icon { color: #1e90ff; }

    .status-error .magsafe-circle { border-color: #ff4757; box-shadow: 0 0 30px rgba(255,71,87,0.6); }
    .status-error .magsafe-icon { color: #ff4757; }
  </style>
</head>
<body>

  <h1>一高祭 受付管理システム</h1>
  
  <div class="tab-container">
    <button class="tab-btn active" data-mode="entry" onclick="setMode('entry')">🟢 初回入場</button>
    <button class="tab-btn" data-mode="exit" onclick="setMode('exit')">🚪 一時退場</button>
    <button class="tab-btn" data-mode="re_entry" onclick="setMode('re_entry')">🔵 再入場</button>
  </div>

  <div id="current-mode-badge">現在のモード: 初回入場</div>

  <div id="wrapper">
    <div class="scan-frame" id="scan-frame"></div>
    <video id="video" autoplay playsinline></video>

    <div id="magsafe-overlay">
      <div class="magsafe-circle" id="magsafe-circle">
        <span class="magsafe-icon" id="magsafe-icon">✓</span>
      </div>
      <div id="magsafe-text">読み取り中...</div>
    </div>
  </div>

  <button id="start-btn" onclick="startCamera()">▶ カメラを開始する</button>

  <script>
    // デプロイしたGASのWebアプリURL（★ここにあなたのURLを入れてください）
    const GAS_URL = "https://script.google.com/a/macros/g.bears.ed.jp/s/AKfycbxdMLfj6qHITIEInB52DC1DJqojKlb-dWb43AoqMchlkCFyuqRpZtqB_0u6vcFydGw/exec";

    let currentMode = "entry"; 
    let video = document.getElementById("video");
    let scanFrame = document.getElementById("scan-frame");
    let isScanning = false;
    let audioCtx = null;

    // モード切り替え関数
    function setMode(mode) {
      currentMode = mode;
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
      
      let badge = document.getElementById("current-mode-badge");
      if (mode === "entry") {
        document.documentElement.style.setProperty('--theme-color', '#2ed573');
        badge.innerText = "現在のモード: 初回入場";
        badge.classList.remove('light-text');
      } else if (mode === "exit") {
        document.documentElement.style.setProperty('--theme-color', '#ffa500');
        badge.innerText = "現在のモード: 一時退場";
        badge.classList.remove('light-text');
      } else if (mode === "re_entry") {
        document.documentElement.style.setProperty('--theme-color', '#1e90ff');
        badge.innerText = "現在のモード: 再入場";
        badge.classList.add('light-text');
      }
    }

    // サウンドエフェクト関数
    function playTone(type) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "ok") {
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === "exit") {
        osc.frequency.setValueAtTime(587, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.stop(audioCtx.currentTime + 0.15);
      } else {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    // カメラ起動
    function startCamera() {
      document.getElementById("start-btn").style.display = "none";
      setMode("entry");
      
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
          video.srcObject = stream;
          isScanning = true;
          requestAnimationFrame(scanQRCode);
        })
        .catch(err => {
          alert("カメラの起動に失敗しました。権限を許可してください。");
          document.getElementById("start-btn").style.display = "inline-block";
        });
    }

    // QRコードスキャンループ
    function scanQRCode() {
      if (!isScanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        let canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        let ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data) {
          isScanning = false;
          // 🎯 QRコードを検知した瞬間に、四角枠をピカッとモード色に光らせる
          scanFrame.classList.add("detected");
          
          // ほんの一瞬光らせてから、チェックイン処理へ
          setTimeout(() => {
            processTicket(code.data);
          }, 150);
          return;
        }
      }
      requestAnimationFrame(scanQRCode);
    }

    // GASへデータを送信してチェックイン
    function processTicket(qrData) {
      let ticketId = "";
      let decodedData = decodeURIComponent(qrData);

      if (decodedData.includes("id=")) {
        ticketId = decodedData.split("id=")[1].split("&")[0].trim();
      } else if (decodedData.startsWith("TKT-")) {
        ticketId = decodedData.trim();
      } else {
        triggerMagsafe("error", "❌ 無効なQRコード", "invalid");
        logInvalidQR(qrData);
        return;
      }

      if (!ticketId) {
        triggerMagsafe("error", "❌ IDの抽出に失敗", "invalid");
        logInvalidQR(qrData);
        return;
      }

      // 「通信中」の状態を作る
      triggerMagsafe("loading", "通信中...", "");

      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          ticketId: ticketId,
          mode: currentMode
        })
      })
      .then(res => res.text())
      .then(result => {
        if (result === "OK") {
          triggerMagsafe("ok", "✅ 入場手続き完了", "ok");
        } else if (result === "EXIT_OK") {
          triggerMagsafe("exit", "🚪 一時退場しました", "exit");
        } else if (result === "RE_ENTRY_OK") {
          triggerMagsafe("reentry", "🔄 再入場手続き完了", "ok");
        } else if (result === "already" || result === "ALREADY_IN") {
          triggerMagsafe("error", "⚠️ すでに滞在中（重複）", "error");
        } else if (result === "ALREADY_OUT") {
          triggerMagsafe("error", "⚠️ すでに退場済みです", "error");
        } else if (result === "ERROR_NOT_IN_YET") {
          triggerMagsafe("error", "❌ まだ入場していません", "error");
        } else {
          triggerMagsafe("error", "❌ チケットが見つかりません", "error");
        }
      })
      .catch(err => {
        triggerMagsafe("error", "📡 通信エラーが発生しました", "error");
      });
    }

    function logInvalidQR(rawCode) {
      fetch(GAS_URL + "?mode=log_invalid&data=" + encodeURIComponent(rawCode), { method: "POST" });
    }

    // MagSafe風アニメーションの表示制御
    function triggerMagsafe(statusClass, text, soundType) {
      let overlay = document.getElementById("magsafe-overlay");
      let circle = document.getElementById("magsafe-circle");
      let icon = document.getElementById("magsafe-icon");
      let txtNode = document.getElementById("magsafe-text");

      // 一旦すべての装飾クラスをまっさらにリセット
      overlay.className = "";
      
      if (statusClass === "loading") {
        overlay.classList.add("active");
        icon.innerText = "⏳";
        txtNode.innerText = text;
        return;
      }

      // 状態クラスを追加してアニメーションをトリガー
      overlay.className = "active status-" + statusClass;
      txtNode.innerText = text;
      
      if (statusClass === "ok" || statusClass === "reentry") icon.innerText = "✓";
      if (statusClass === "exit") icon.innerText = "🚪";
      if (statusClass === "error") icon.innerText = "⚠️";

      if (soundType) playTone(soundType);

      // 受付を爆速にするため、アニメ表示時間を1.5秒に短縮
      setTimeout(() => {
        overlay.className = "";
        scanFrame.classList.remove("detected"); // 光る枠線を元に戻す
        isScanning = true;
        requestAnimationFrame(scanQRCode);
      }, 1500);
    }
  </script>
</body>
</html>
